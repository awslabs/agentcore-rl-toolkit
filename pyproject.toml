[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcore-rl-toolkit"
version = "0.1.3"
description = "Toolkit for Seamlessly Enabling RL Training with Bedrock AgentCore."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Amazon Web Services - Labs", email = "opensource@amazon.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "bedrock-agentcore>=1.0.3",
    "bedrock-agentcore-starter-toolkit>=0.2.0",
    "boto3>=1.40.55",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
    "pre-commit>=3.0",
    # rollout_gateway test deps (so the full suite runs without a separate install):
    # aiohttp for adapter/server tests, transformers for renderer round-trip / E2E
    # (>=5.0 matches the [gateway] extra: tokenizer.parse_response).
    "aiohttp>=3.9",
    "transformers>=5.0",
    # openai: real-SDK wire-contract test for the gateway (Bearer-slot session capture).
    "openai>=1.0",
]
gateway = [
    # The rollout capture gateway (agentcore_rl_toolkit.rollout_gateway). Trainer-side
    # only — the agent-side surface (AgentCoreRLApp, RolloutClient) needs none of this.
    # aiohttp: the gateway HTTP server + HTTP sampling backends.
    # transformers: HF tokenizer for HfTemplateRenderer — apply_chat_template plus
    # tokenizer.parse_response for the schema derender (>=5.0; the legacy schema
    # engine incl. jmespath transforms shipped in 5.0.0).
    # jmespath: transform expressions in response schemas;
    # transitively present via boto3 already, declared because the gateway relies on it.
    "aiohttp>=3.9",
    "transformers>=5.0",
    "jmespath>=1.0",
]
# NOTE: the Tinker backend (TinkerSdkBackend + TinkerRenderer) needs `tinker` and
# `tinker-cookbook`, which require Python >=3.11. They are intentionally NOT declared as
# an extra here: this package supports Python >=3.10, and pinning a >=3.11-only
# dependency would make the resolution unsatisfiable on 3.10. Install them manually
# (`pip install tinker tinker-cookbook`) on Python >=3.11 to use the Tinker backend.
#
# NOTE: HfTemplateRenderer parses tool calls with a dependency-free regex covering the
# common <tool_call><function=...> format, and reasoning via a </think> split. Engine
# tool/reasoning parsers (sglang, vllm) are not a declared dependency; a caller that
# needs one for an exotic format installs it and passes a parser name explicitly.
slime = [
    # Proxy that sits between the agent and SGLang during training, capturing
    # token IDs and logprobs into TraceRecords that slime consumes as Samples.
    # Required by agentcore_rl_toolkit.backends.slime.{gateway,rollout,traces}.
    "rllm-model-gateway>=0.1.0",
]
rllm = [
    # rllm training framework. Not on PyPI — installed from GitHub.
    # rllm pulls in rllm-model-gateway transitively for trajectory capture.
    # Users still need to install a training backend (verl or Tinker)
    # separately per rllm's instructions.
    #
    # NOTE: do not depend on rllm's own [agentcore] extra here — it pulls
    # in agentcore-rl-toolkit, which would create a circular dependency.
    #
    # The git source is declared in [tool.uv.sources] below rather than inline
    # here, because PyPI rejects direct-reference (git URL) dependencies in
    # uploaded packages. uv reads the source when installing from the repo.
    "rllm",
]
verl = [
    "transformers==5.8.1",
    "numpy",
    "verl==0.8.0",
    "ray",
    "torch>=2.10.0",
    "torchvision>=0.23.0",
    "vllm==0.22.0",
    "flash-linear-attention",
    "flash-attn==2.8.3",
    "qwen-vl-utils",
    "rllm-model-gateway>=0.1.0",
]
verl-experimental = [
    # For backends/experimental/verl — see its README for the design and install
    # notes. verl is pinned via [tool.uv.sources] below.
    "verl",
    # verl declares runtime deps in requirements.txt (its Docker images pip-install
    # it), not in setup.py install_requires — so a git install of verl misses them.
    # Declared here as proven needed (import-time failures on our training path):
    "transferqueue==0.1.8",  # v1 trainer data plane (main_ppo.py)
    "orjson",  # verl.utils.tracking (undeclared even in verl's requirements.txt)
    "aiohttp>=3.9",
    # Pinned: newest release below verl main's later <5.12 cap (our pinned verl
    # commit itself only requires !=5.6.0; vllm 0.23.0 allows >=4.56 outside 5.0-5.5.0).
    # The gateway's schema derender needs tokenizer.parse_response (transformers >=5.0).
    "transformers==5.12.1",
    "numpy",
    "ray",
    "torch>=2.10.0",
    "torchvision>=0.23.0",
    # matches verl's reference stack at the pinned commit
    # (docker/Dockerfile.stable.vllm: vllm 0.23.0 / torch 2.11.0 / cu130 / flash-attn 2.8.3)
    "vllm==0.23.0",
    "flash-linear-attention",
    "flash-attn==2.8.3",
    "qwen-vl-utils",
]
verl-experimental-ci = [
    # CI slice of [verl-experimental] for the experimental-verl-integration
    # workflow: same pinned verl (the [tool.uv.sources] entry applies) and
    # declared runtime deps, but CPU torch (index steering below) and no
    # inference engines (vllm / flash-attn / qwen-vl-utils) — the backend's
    # integration tests fake the LLM-server seam, and none of those install on
    # a GitHub runner (CUDA wheels, source builds).
    "verl",
    "transferqueue==0.1.8",
    "orjson",
    # verl deps the full extra gets transitively via vllm: fastapi/uvicorn are
    # in verl's requirements.txt (not its setup.py); cachetools is undeclared
    # even there (verl/workers/rollout/llm_server.py).
    "cachetools",
    "fastapi",
    "uvicorn",
    "aiohttp>=3.9",
    "transformers==5.12.1",  # keep in lockstep with [verl-experimental]
    "numpy",
    "ray",
    "torch>=2.10.0",
    "torchvision>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/awslabs/agentcore-rl-toolkit"

[tool.uv]
# Declaring verl and rllm as conflicting extras lets uv resolve each
# in its own fork instead of forcing one universal lock.
conflicts = [
    [
        { extra = "verl" },
        { extra = "rllm" },
        { extra = "verl-experimental" },
        { extra = "verl-experimental-ci" },
    ],
]
override-dependencies = [
    "numpy>=1.26.0",
]

[tool.uv.sources]
# rllm is not published to PyPI; install it from GitHub. The git source is
# declared here rather than inline in [project.optional-dependencies] so the
# published package metadata stays free of direct-reference (git URL)
# dependencies, which PyPI rejects. uv reads this source when installing the
# [rllm] extra from a checkout of this repo.
rllm = { git = "https://github.com/rllm-org/rllm.git" }
# verl pinned to uni-agent's blessed submodule commit for the experimental
# backend (backends/experimental/verl). Applies only when the
# [verl-experimental] extra is selected; the legacy [verl] extra resolves
# verl==0.8.0 from PyPI in its own conflict fork.
verl = [
    { git = "https://github.com/volcengine/verl.git", rev = "78bba31d1a6b95084d83f8bddd59c190ca704144", extra = "verl-experimental" },
    { git = "https://github.com/volcengine/verl.git", rev = "78bba31d1a6b95084d83f8bddd59c190ca704144", extra = "verl-experimental-ci" },
]
# CI fork only: CPU torch wheels so the CUDA distribution (plus nvidia-* wheels)
# never resolves on GitHub runners. The other extras keep the default index.
torch = [
    { index = "pytorch-cpu", extra = "verl-experimental-ci" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "verl-experimental-ci" },
]
# Prebuilt wheels; building flash-attn from PyPI's sdist takes ~an hour of nvcc.
flash-attn = { index = "astral-cu130" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true


[tool.hatch.metadata]
# Required so the [rllm] optional extra can pin rllm via a git URL
# (PEP 508 direct reference). Hatchling rejects these by default.
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.ruff]
line-length = 120
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]

[tool.ruff.lint.isort]
known-first-party = ["agentcore_rl_toolkit"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/rollout_gateway/integration_test"
