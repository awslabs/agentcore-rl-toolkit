[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcore-rl-toolkit"
version = "0.2.0"
description = "Toolkit for Seamlessly Enabling RL Training with Bedrock AgentCore."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Amazon Web Services - Labs", email = "opensource@amazon.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.optional-dependencies]
core = [
    "agentcore-rl-toolkit[server,rollout]",
]
server = [
    "bedrock-agentcore>=1.23.1",
]
rollout = [
    "boto3>=1.43.79",
    "botocore>=1.43.79",
    "aiobotocore>=3.9.2",
    "aiohttp>=3.9",
    "httpx>=0.27.0",
    "pydantic>=2",
    "backoff",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "openai>=1.0",
    "agentcore-rl-toolkit[core,gateway,a2a-server]",
]
gateway = [
    # aiohttp: the gateway HTTP server + HTTP sampling backends.
    # transformers: HF tokenizer for HfTemplateRenderer — apply_chat_template plus
    # the response-template parser (>=5.16.1).
    "aiohttp>=3.9",
    "transformers>=5.16.1",
    "tokenizers>=0.23.1",  # native async_encode; transformers 5.16's floor
    "jinja2>=3.1.0",  # HF apply_chat_template; optional in transformers itself
]
tinker_api = [
    # Includes the local gateway for HF rendering and trajectory capture.
    # SkyRL / Megatron / vLLM live in the endpoint's separate GPU environment.
    "agentcore-rl-toolkit[rollout,gateway]",
    "tinker==0.30.1",
]
tinker_skyrl = [
    "agentcore-rl-toolkit[rollout,gateway]",
    "tinker==0.24.1",
]
a2a-server = [
    "agentcore-rl-toolkit[server]",
    "a2a-sdk[http-server]>=1.0.1,<2.0",
]
a2a = [
    "agentcore-rl-toolkit[rollout]",
    "a2a-sdk>=1.0.1,<2.0",
]
verl = [
    "agentcore-rl-toolkit[rollout,gateway]",
    # For backends/verl — see its README for design and install notes.
    # Pinned to a verl main commit through [tool.uv.sources]; the first release
    # carrying transformers 5.16 support is 0.10. verl-core holds the runtime
    # dependencies verl's base (setup.py) metadata omits, e.g. TransferQueue.
    "verl[verl-core]>=0.10.0.dev0",
    "orjson",  # required for tracking; not in verl-core
    "aiohttp>=3.9",
    "transformers==5.16.1",
    # transformers / torch / torchvision / vllm match verl's vllm extra.
    "torch==2.13.0",
    "torchvision==0.28.0",
    "vllm==0.32.0",
    # 0.5.1's gated_delta_rule backward faults with "Triton Error [CUDA]: misaligned
    # address" when H == HV (Qwen3.6-27B expands q/k to 48 heads via repeat_interleave
    # before the call, so all 48 linear_attention layers hit it on the first optimizer
    # step). Not varlen-specific; reproduces on the dense path at T=512.
    "flash-linear-attention>=0.5.2",
    "flash-attn==2.8.3",
]
[dependency-groups]
sagemaker-integration = [
    "agentcore-rl-toolkit[rollout,gateway]",
    "sagemaker-train>=1.13.0",
    "httpx>=0.27.0",
    "openai>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
swe-agent = [
    "datasets",
    "polars>=1.41.2",
    "tqdm",
    "aws-bedrock-token-generator>=1.1.0",
]
verl-ci = [
    # CI uses CPU torch and omits inference-only dependencies because the
    # integration tests fake the LLM-server seam.
    "verl[verl-core]>=0.10.0.dev0",
    "orjson",
    "aiohttp>=3.9",
    "transformers==5.16.1",  # keep in lockstep with the [verl] extra
    "torch==2.13.0",
    "torchvision==0.28.0",
]
verl-megatron = [
    "torch==2.13.0",  # Must match the verl wheelhouse index below.
    "apex",
    # TE comes from Astral rather than verl's wheelhouse: the wheelhouse build of
    # libtransformer_engine.so requires GLIBCXX_3.4.32 (GCC 13 / Ubuntu 24.04) and
    # fails to load on Ubuntu 22.04 hosts; Astral's manylinux build of the same
    # version does not. Root-pin TE's transitive packages so uv applies the explicit
    # Astral index to each.
    "transformer-engine[pytorch]==2.16.1",
    "transformer-engine-torch==2.16.1",
    "transformer-engine-cu13==2.16.1",
    "megatron-core==0.19.2",
    "megatron-bridge==0.6.2",
    # Required at import time after stripping megatron-bridge's dependencies below.
    "nvidia-modelopt==0.44.0",
    "megatron-energon==7.4.1",
]

[project.urls]
Homepage = "https://github.com/awslabs/agentcore-rl-toolkit"

# Loaded by SGLang in each of its processes; no-op unless AGENTCORE_SGLANG_TOKEN_SAMPLES=1.
[project.entry-points."sglang.srt.plugins"]
agentcore_token_samples = "agentcore_rl_toolkit.rollout_gateway.sampling_backends.sglang_token_samples:register"

[tool.uv]
# Resolve incompatible extras and groups in separate forks of the lockfile.
conflicts = [
    [
        { extra = "tinker_api" },
        { extra = "tinker_skyrl" },
    ],
    [
        { extra = "verl" },
        { group = "verl-ci" },
    ],
    # Installed alongside verl, so it needs a separate conflict group.
    [
        { group = "verl-ci" },
        { group = "verl-megatron" },
    ],
    # vllm 0.32 requires protobuf 7 on s390x; sagemaker-core caps protobuf below 7.
    [
        { extra = "verl" },
        { group = "sagemaker-integration" },
    ],
]

[tool.uv.dependency-groups]
verl-megatron = { requires-python = ">=3.12,<3.13" }

# Megatron-Bridge's published dependencies conflict with the verl stack.
[[tool.uv.dependency-metadata]]
name = "megatron-bridge"
version = "0.6.2"
requires-dist = []

[tool.uv.sources]
# verl main with vllm 0.32.0 / transformers 5.16.1 (verl-project/verl#8390).
verl = { git = "https://github.com/verl-project/verl.git", rev = "f78fd053e13c3d021e51de5e81afc54dddd13993" }
# CI group only: CPU torch wheels so the CUDA distribution (plus nvidia-* wheels)
# never resolves on GitHub runners. The other extras keep the default index.
torch = [
    { index = "pytorch-cpu", group = "verl-ci" },
]
torchvision = [
    { index = "pytorch-cpu", group = "verl-ci" },
]
# Prebuilt GPU wheels avoid local source builds from PyPI.
apex = { index = "verl-wheelhouse" }
flash-attn = { index = "verl-wheelhouse" }
transformer-engine = { index = "astral-cu130" }
transformer-engine-torch = { index = "astral-cu130" }
transformer-engine-cu13 = { index = "astral-cu130" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true

[[tool.uv.index]]
name = "verl-wheelhouse"
url = "https://verl-project.github.io/verl-wheelhouse/cu130/torch2.13/simple/"
explicit = true


[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.ruff]
line-length = 120
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]

[tool.ruff.lint.isort]
known-first-party = ["agentcore_rl_toolkit"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/rollout_gateway/integration_test"
