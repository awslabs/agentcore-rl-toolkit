[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcore-rl-toolkit"
version = "0.1.3"
description = "Toolkit for Seamlessly Enabling RL Training with Bedrock AgentCore."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Amazon Web Services - Labs", email = "opensource@amazon.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "bedrock-agentcore>=1.0.3",
    "bedrock-agentcore-starter-toolkit>=0.2.0",
    "boto3>=1.40.55",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
    "pre-commit>=3.0",
    # rollout_gateway test deps (so the full suite runs without a separate install):
    # aiohttp for adapter/server tests, transformers for renderer round-trip / E2E
    # (>=5.0 matches the [gateway] extra: tokenizer.parse_response).
    "aiohttp>=3.9",
    "transformers>=5.0",
    # openai: real-SDK wire-contract test for the gateway (Bearer-slot session capture).
    "openai>=1.0",
    # Runtime deps of agentcore_rl_toolkit.{aws_tools,rollout_session} rather than
    # test-only tools: tests/{aws_tools,rollout_session} import those packages, so
    # without them the suite fails to collect. Taken as the [rollout] extra rather
    # than relisted here — `uv sync --extra dev` is the one install the unit-test and
    # pre-commit workflows do, and a second copy of that list is a second thing to
    # keep in step. (The gateway deps above are spelled out instead because the tests
    # need floors of their own: transformers>=5.0 for tokenizer.parse_response.)
    "agentcore-rl-toolkit[rollout]",
    # transformers above also covers the swe-agent example's rollout_batch.py,
    # whose gateway endpoint measures tokenizer lengths.
]
gateway = [
    # The rollout capture gateway (agentcore_rl_toolkit.rollout_gateway). Trainer-side
    # only — the agent-side surface (AgentCoreRLApp, RolloutClient) needs none of this.
    # aiohttp: the gateway HTTP server + HTTP sampling backends.
    # transformers: HF tokenizer for HfTemplateRenderer — apply_chat_template plus
    # tokenizer.parse_response for the schema derender (>=5.0; the legacy schema
    # engine incl. jmespath transforms shipped in 5.0.0).
    # jmespath: transform expressions in response schemas;
    # transitively present via boto3 already, declared because the gateway relies on it.
    "aiohttp>=3.9",
    "transformers>=5.0",
    "jmespath>=1.0",
]
# NOTE: the Tinker backend (TinkerSdkBackend + TinkerRenderer) needs `tinker` and
# `tinker-cookbook`; install them manually (`pip install tinker tinker-cookbook`) to use
# it. They are not declared as an extra, but the reason they *could not* be is gone: it
# was that they require Python >=3.11 while this package supported >=3.10, which made the
# pin unsatisfiable on the floor. The floor is now >=3.11, so a [tinker] extra is
# available whenever the backend wants one. Both pull torch.
#
# NOTE: HfTemplateRenderer parses tool calls with a dependency-free regex covering the
# common <tool_call><function=...> format, and reasoning via a </think> split. Engine
# tool/reasoning parsers (sglang, vllm) are not a declared dependency; a caller that
# needs one for an exotic format installs it and passes a parser name explicitly.
rollout = [
    # Driving containerized rollouts: agentcore_rl_toolkit.aws_tools and
    # .rollout_session. Trainer- and host-side only, like [gateway] — the agent-side
    # surface (AgentCoreRLApp, RolloutClient) needs none of it, and neither does
    # .concurrency, which has no third-party dependency at all.
    # aioboto3: the async session in aws_tools.boto3_tools that every other aws_tools
    # module builds on, and with it every rollout_session module above .wire.
    # backoff: retry decorators over the ACR and HTTP calls in
    # rollout_session.{agentcore,docker}_session.
    # aiohttp: rollout_session.docker_session's HTTP wire calls to a local container.
    # pydantic: the .wire types and the aws_tools models subclass BaseModel. Present
    # transitively via bedrock-agentcore already, declared because these modules
    # import it directly.
    #
    # The aioboto3 floor is load-bearing, and not a "recent enough" guess. aioboto3
    # pins `aiobotocore[boto3]` exactly, and that extra pins boto3 exactly, which
    # collides with this package's own `boto3>=1.40.55` — so a resolver with nothing
    # else to go on satisfies the collision by walking aioboto3 *backwards* until the
    # pin goes away, which it does in the 7.x line (2020) whose requirement is only
    # `aiobotocore[boto3]>=0.12`. Dropping the aiobotocore override below and
    # re-resolving lands on aioboto3 7.1.0 + aiobotocore 0.3.3 (2018) to prove it.
    # Those versions install and import fine and fail only when used: 7.x's
    # `Session.resource()` is a passthrough to boto3's, which touches `client.meta` on
    # what modern aiobotocore returns as an async context manager, so every
    # `async with session.resource(...)` in aws_tools raises AttributeError. The unit
    # tests mock boto3 and so cannot see it. The override keeps a fresh resolve on
    # 15.x, but only this floor keeps it there.
    "aioboto3>=15.5.0",
    "backoff",
    "aiohttp>=3.9",
    "pydantic",
]
# NOTE: the batch-eval harness that drives these sessions is not in this package at
# all — it is examples/openhands_swe_agent/rollout_batch.py, since a batch eval of
# a dataset is a recipe's concern rather than the session layer's. It imports on
# [rollout] alone; its VllmGatewayEndpoint stands up a capture gateway and so needs
# [gateway] on top, but those imports sit inside `start()` so the Bedrock-only path
# pays for none of it. The dataset and reporting tooling it reaches equally lazily
# (polars, tqdm, aws-bedrock-token-generator) is in the swe-agent dependency group.
slime = [
    # Proxy that sits between the agent and SGLang during training, capturing
    # token IDs and logprobs into TraceRecords that slime consumes as Samples.
    # Required by agentcore_rl_toolkit.backends.slime.{gateway,rollout,traces}.
    "rllm-model-gateway>=0.1.0",
]
rllm = [
    # rllm training framework. Not on PyPI — installed from GitHub.
    # rllm pulls in rllm-model-gateway transitively for trajectory capture.
    # Users still need to install a training backend (verl or Tinker)
    # separately per rllm's instructions.
    #
    # NOTE: do not depend on rllm's own [agentcore] extra here — it pulls
    # in agentcore-rl-toolkit, which would create a circular dependency.
    #
    # The git source is declared in [tool.uv.sources] below rather than inline
    # here, because PyPI rejects direct-reference (git URL) dependencies in
    # uploaded packages. uv reads the source when installing from the repo.
    "rllm",
]
verl = [
    # For backends/verl — see its README for design and install notes.
    "verl==0.9.0",
    # verl 0.9.0 declares its core dependencies, but still omits these dependencies
    # required at import time on our training path:
    "transferqueue==0.1.8",  # required by the v1 trainer
    "orjson",  # required for tracking
    "aiohttp>=3.9",
    # The gateway's schema derender needs tokenizer.parse_response (transformers >=5.0).
    "transformers==5.12.1",
    "numpy",
    "ray",
    "torch>=2.10.0",
    "torchvision>=0.23.0",
    # matches verl 0.9.0's reference stack
    "vllm==0.24.0",
    "flash-linear-attention",
    "flash-attn==2.8.3",
    "qwen-vl-utils",
]
[dependency-groups]
swe-agent = [
    # What the host-side scripts of examples/openhands_swe_agent need beyond the
    # toolkit itself -- preprocess.py (dataset build), analyze.py (run reports),
    # evaluate.py (batch eval). A group rather than an extra because this is example
    # tooling run from a checkout, not a surface an installed wheel should offer. The
    # agent's own container image is built from that example's pyproject
    # (openhands/strands harness deps), so none of that is duplicated here.
    #
    # The runtime deps of the toolkit packages those scripts drive (aws_tools,
    # concurrency, rollout_session) are *not* here: they are in the [dev] extra,
    # which is what the unit-test workflow installs. Run the host scripts from a root
    # env synced with `--extra dev --extra gateway --group swe-agent`.
    #
    # preprocess.py: pulls the SWE-bench split from HF, then writes/reads the task
    # parquet and the run records that analyze.py reports on. The example's own
    # rollout_batch.run_eval reads that parquet too, importing polars inside the
    # function for this reason.
    "datasets",
    "polars>=1.41.2",
    # evaluate.py reaches these two through the example's own rollout_batch.py:
    # run_eval's progress bar over the rollout fan-out, and BedrockEndpoint minting a
    # Bedrock bearer token. Both are imported inside the functions that use them, so
    # they are needed to *run* an eval, not to import the module.
    "tqdm",
    "aws-bedrock-token-generator>=1.1.0",
]
verl-ci = [
    # CI uses CPU torch and omits inference-only dependencies because the
    # integration tests fake the LLM-server seam.
    "verl==0.9.0",
    "transferqueue==0.1.8",
    "orjson",
    # verl deps the full extra gets transitively via vllm: fastapi/uvicorn are
    # in verl's requirements.txt (not its setup.py); cachetools is undeclared
    # even there (verl/workers/rollout/llm_server.py).
    "cachetools",
    "fastapi",
    "uvicorn",
    "aiohttp>=3.9",
    "transformers==5.12.1",  # keep in lockstep with the [verl] extra
    "numpy",
    "ray",
    "torch>=2.10.0",
    "torchvision>=0.23.0",
]
verl-megatron = [
    # Root-pin TE's transitive packages so uv applies the explicit Astral index to each.
    "transformer-engine[pytorch]==2.16.0",
    "transformer-engine-torch==2.16.0",
    "transformer-engine-cu13==2.16.0",
    "megatron-core==0.18.0",
    "megatron-bridge==0.5.0",
    # Required at import time after stripping megatron-bridge's dependencies below.
    "nvidia-modelopt>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/awslabs/agentcore-rl-toolkit"

[tool.uv]
# Declaring verl and rllm as conflicting extras lets uv resolve each
# in its own fork instead of forcing one universal lock.
#
conflicts = [
    [
        { extra = "verl" },
        { extra = "rllm" },
        { group = "verl-ci" },
    ],
    # Installed alongside verl, so it needs a separate conflict group.
    [
        { extra = "rllm" },
        { group = "verl-ci" },
        { group = "verl-megatron" },
    ],
]
override-dependencies = [
    { package = { name = "verl", version = "0.9.0" }, dependencies = ["transformers==5.12.1"] },
    # aiobotocore caps botocore (3.9.0 pins <1.43.57), which strands the
    # bedrock-agentcore-control model on a revision predating the capacity-provider
    # API that aws_tools.agentcore_control calls. Override the cap so the newer
    # service model wins; without this, create_capacity_provider raises
    # OperationNotFoundError and agentcore_control_test.py cannot even collect.
    "aiobotocore>=3.9.0",
    "botocore>=1.43.79",
]

[tool.uv.dependency-groups]
verl-megatron = { requires-python = ">=3.12,<3.13" }

# Megatron-Bridge's published dependencies conflict with the verl stack.
[[tool.uv.dependency-metadata]]
name = "megatron-bridge"
version = "0.5.0"
requires-dist = []

[tool.uv.sources]
# rllm is not published to PyPI; install it from GitHub. The git source is
# declared here rather than inline in [project.optional-dependencies] so the
# published package metadata stays free of direct-reference (git URL)
# dependencies, which PyPI rejects. uv reads this source when installing the
# [rllm] extra from a checkout of this repo.
rllm = { git = "https://github.com/rllm-org/rllm.git" }
# CI group only: CPU torch wheels so the CUDA distribution (plus nvidia-* wheels)
# never resolves on GitHub runners. The other extras keep the default index.
torch = [
    { index = "pytorch-cpu", group = "verl-ci" },
]
torchvision = [
    { index = "pytorch-cpu", group = "verl-ci" },
]
# Prebuilt GPU wheels avoid local source builds from PyPI.
flash-attn = { index = "astral-cu130" }
transformer-engine = { index = "astral-cu130" }
transformer-engine-torch = { index = "astral-cu130" }
transformer-engine-cu13 = { index = "astral-cu130" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true


[tool.hatch.metadata]
# Required so the [rllm] optional extra can pin rllm via a git URL
# (PEP 508 direct reference). Hatchling rejects these by default.
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.ruff]
line-length = 120
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]

[tool.ruff.lint.isort]
known-first-party = ["agentcore_rl_toolkit"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/rollout_gateway/integration_test"
