[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcore-rl-toolkit"
version = "0.2.0"
description = "Toolkit for Seamlessly Enabling RL Training with Bedrock AgentCore."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Amazon Web Services - Labs", email = "opensource@amazon.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.optional-dependencies]
core = [
    "agentcore-rl-toolkit[server,rollout]",
]
server = [
    "bedrock-agentcore>=1.23.1",
]
rollout = [
    "boto3>=1.43.79",
    "botocore>=1.43.79",
    "aiobotocore>=3.9.2",
    "aiohttp>=3.9",
    "httpx>=0.27.0",
    "pydantic>=2",
    "backoff",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "openai>=1.0",
    "agentcore-rl-toolkit[core,gateway,a2a-server]",
]
gateway = [
    # The rollout capture gateway (agentcore_rl_toolkit.rollout_gateway). Trainer-side
    # only — the agent-side surface (AgentCoreRLApp, RolloutClient) needs none of this.
    # aiohttp: the gateway HTTP server + HTTP sampling backends.
    # transformers: HF tokenizer for HfTemplateRenderer — apply_chat_template plus
    # tokenizer.parse_response for the schema derender (>=5.0; the legacy schema
    # engine incl. jmespath transforms shipped in 5.0.0).
    # jmespath: transform expressions in response schemas.
    "aiohttp>=3.9",
    "transformers>=5.0",
    "tokenizers>=0.22.2",  # native async_encode
    "jmespath>=1.0",
    "jinja2>=3.1.0",  # HF apply_chat_template; optional in transformers itself
]
tinker_api = [
    # Includes the local gateway for HF rendering and trajectory capture.
    # SkyRL / Megatron / vLLM live in the endpoint's separate GPU environment.
    "agentcore-rl-toolkit[rollout,gateway]",
    "tinker==0.30.1",
]
tinker_skyrl = [
    "agentcore-rl-toolkit[rollout,gateway]",
    "tinker==0.24.1",
]
sagemaker_mtrl = [
    # Agent-side: `runtime.sagemaker_mtrl` serves SageMaker MTRL requests through a loopback forwarder.
    # Bounded because it mirrors SDK behavior without a public API; tests/runtime/test_sagemaker_rft.py
    # checks the mirror against the installed SDK before the bound is raised.
    "agentcore-rl-toolkit[server]",
    "aiohttp>=3.9",
    "sagemaker-train>=1.27.0,<2",
]
a2a-server = [
    "agentcore-rl-toolkit[server]",
    "a2a-sdk[http-server]>=1.0.1,<2.0",
]
a2a = [
    "agentcore-rl-toolkit[rollout]",
    "a2a-sdk>=1.0.1,<2.0",
]
verl = [
    "agentcore-rl-toolkit[rollout,gateway]",
    # For backends/verl — see its README for design and install notes.
    "verl==0.9.0",
    # verl 0.9.0 declares its core dependencies, but still omits these dependencies
    # required at import time on our training path:
    "transferqueue==0.1.10",  # required by the v1 trainer
    "orjson",  # required for tracking
    "aiohttp>=3.9",
    # The gateway's schema derender needs tokenizer.parse_response (transformers >=5.0).
    "transformers==5.12.1",
    "numpy",
    "ray",
    "torch>=2.10.0",
    "torchvision>=0.23.0",
    # matches verl 0.9.0's reference stack
    "vllm==0.24.0",
    # 0.5.1's gated_delta_rule backward faults with "Triton Error [CUDA]: misaligned
    # address" when H == HV (Qwen3.6-27B expands q/k to 48 heads via repeat_interleave
    # before the call, so all 48 linear_attention layers hit it on the first optimizer
    # step). Not varlen-specific; reproduces on the dense path at T=512.
    "flash-linear-attention>=0.5.2",
    "flash-attn==2.8.3",
    "qwen-vl-utils",
]
[dependency-groups]
sagemaker-integration = [
    "agentcore-rl-toolkit[rollout,gateway]",
    "sagemaker-train>=1.13.0",
    "httpx>=0.27.0",
    "openai>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
swe-agent = [
    "datasets",
    "polars>=1.41.2",
    "tqdm",
    "aws-bedrock-token-generator>=1.1.0",
]
verl-ci = [
    # CI uses CPU torch and omits inference-only dependencies because the
    # integration tests fake the LLM-server seam.
    "verl==0.9.0",
    "transferqueue==0.1.10",
    "orjson",
    # verl deps the full extra gets transitively via vllm: fastapi/uvicorn are
    # in verl's requirements.txt (not its setup.py); cachetools is undeclared
    # even there (verl/workers/rollout/llm_server.py).
    "cachetools",
    "fastapi",
    "uvicorn",
    "aiohttp>=3.9",
    "transformers==5.12.1",  # keep in lockstep with the [verl] extra
    "numpy",
    "ray",
    "torch>=2.10.0",
    "torchvision>=0.23.0",
]
verl-megatron = [
    "torch==2.11.0",  # Must match the Apex wheel index below.
    "apex",
    # Root-pin TE's transitive packages so uv applies the explicit Astral index to each.
    "transformer-engine[pytorch]==2.16.0",
    "transformer-engine-torch==2.16.0",
    "transformer-engine-cu13==2.16.0",
    "megatron-core==0.18.0",
    "megatron-bridge==0.5.0",
    # Required at import time after stripping megatron-bridge's dependencies below.
    "nvidia-modelopt>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/awslabs/agentcore-rl-toolkit"

[tool.uv]
# Resolve incompatible extras and groups in separate forks of the lockfile.
conflicts = [
    [
        { extra = "tinker_api" },
        { extra = "tinker_skyrl" },
    ],
    [
        { extra = "verl" },
        { group = "verl-ci" },
    ],
    # Installed alongside verl, so it needs a separate conflict group.
    [
        { group = "verl-ci" },
        { group = "verl-megatron" },
    ],
]
override-dependencies = [
    { package = { name = "verl", version = "0.9.0" }, dependencies = ["transformers==5.12.1"] },
]

[tool.uv.dependency-groups]
verl-megatron = { requires-python = ">=3.12,<3.13" }

# Megatron-Bridge's published dependencies conflict with the verl stack.
[[tool.uv.dependency-metadata]]
name = "megatron-bridge"
version = "0.5.0"
requires-dist = []

[tool.uv.sources]
# CI group only: CPU torch wheels so the CUDA distribution (plus nvidia-* wheels)
# never resolves on GitHub runners. The other extras keep the default index.
torch = [
    { index = "pytorch-cpu", group = "verl-ci" },
]
torchvision = [
    { index = "pytorch-cpu", group = "verl-ci" },
]
# Prebuilt GPU wheels avoid local source builds from PyPI.
apex = { index = "verl-wheelhouse" }
flash-attn = { index = "astral-cu130" }
transformer-engine = { index = "astral-cu130" }
transformer-engine-torch = { index = "astral-cu130" }
transformer-engine-cu13 = { index = "astral-cu130" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true

[[tool.uv.index]]
name = "verl-wheelhouse"
url = "https://verl-project.github.io/verl-wheelhouse/cu130/torch2.11/simple/"
explicit = true


[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.ruff]
line-length = 120
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]

[tool.ruff.lint.isort]
known-first-party = ["agentcore_rl_toolkit"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/rollout_gateway/integration_test"
