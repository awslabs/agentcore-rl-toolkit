# Offloading trades update latency for memory, which is what makes room for the colocated
# rollout engine's KV cache on the same GPUs. Parameters stay resident (they are read every
# microbatch); gradients and the optimizer do not.
actor_rollout_ref:
  actor:
    megatron:
      param_offload: true
      grad_offload: true
      optimizer_offload: true

    optim:
      # Megatron's own CPU-offloaded optimizer, overlapping its D2H/H2D copies with compute
      override_optimizer_config:
        optimizer_cpu_offload: true
        optimizer_offload_fraction: 1.0
        overlap_cpu_optimizer_d2h_h2d: true
