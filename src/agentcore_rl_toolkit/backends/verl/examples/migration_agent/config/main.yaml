# GRPO on MigrationBench (Java 8->17) with rollouts as AgentCore Runtime sessions of the
# `examples/strands_migration_agent` container, driven by `RolloutSessionAgentLoop`.
#
# Qwen3-Coder-30B-A3B is a sparse MoE, so this trains with Megatron expert parallelism and
# LoRA rather than the math_agent recipe's FSDP full fine-tune. Every group below fixes one
# concern; see README.md for what to swap.
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_megatron_trainer
  - megatron
  - megatron_offload
  - megatron_recompute
  - lora
  - grpo
  - dataset_migrationbench
  - qwen3_coder_30b_p6
  - rollout_session_agent_loop
  - cluster_n1
  - _self_

actor_rollout_ref:
  rollout:
    agent:
      # asyncio workers sharing this run's `rollout_concurrency` trajectories; each hosts
      # its own rollout-gateway thread, and a worker's rollouts are all on its event loop
      num_workers: 32

trainer:
  v1:
    # verl's v1 sync trainer plus this repo's mixins; registered by
    # backends/verl/trainer.py, which VERL_USE_EXTERNAL_MODULES must name (see README)
    trainer_mode: agentcore_sync

  project_name: agentcore_grpo
  experiment_name: migrationbench_qwen3_coder_30b

  critic_warmup: 0
  resume_mode: disable
  default_local_dir: ${oc.env:checkpoint_path_prefix}/${trainer.project_name}/${trainer.experiment_name}
  logger:
    - console
    - wandb

  # training run
  val_before_train: true
  save_freq: 15
  test_freq: 15
  total_epochs: 1
