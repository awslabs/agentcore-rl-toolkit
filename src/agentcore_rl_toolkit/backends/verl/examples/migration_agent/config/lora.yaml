actor_rollout_ref:
  actor:
    optim:
      # LoRA takes ~10x the full fine-tuning rate
      # See: https://thinkingmachines.ai/blog/lora/#reinforcement-learning
      lr: 1e-5
  model:
    lora:
      rank: 64
      alpha: 128
      # merged into the base weights, so the rollout engine loads ordinary weights
      merge: true
