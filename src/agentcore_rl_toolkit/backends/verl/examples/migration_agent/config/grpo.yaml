# GRPO with a KL loss against the frozen reference policy, and the async vLLM rollout the
# agent-loop path needs. Unlike the swe_agent recipe (`use_kl_loss: false`), this one keeps
# the KL term, which is what puts a reference policy in the run -- hence the `ref` settings
# in the model group.
actor_rollout_ref:
  actor:
    # no bonus for high entropy
    entropy_coeff: 0

    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl

    # length-aggregated across the sequence
    loss_agg_mode: seq-mean-token-sum

    checkpoint:
      # LoRA adapters are merged into the base weights on save, so optimizer/extra state
      # is not worth its size at this cadence
      save_contents: ["model"]

  rollout:
    name: vllm
    # the agent-loop path: generation is driven by RolloutSessionAgentLoop through the
    # rollout gateway, not by verl's own batch generation
    mode: async
    temperature: 1.0

    val_kwargs:
      n: 1
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      do_sample: true

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
