- name: agentcore_agent
  _target_: agentcore_rl_toolkit.backends.verl.agent_loop.AgentCoreAgentLoop
  agent_runtime_arn: ${oc.env:AGENT_RUNTIME_ARN}
  s3_bucket: ${oc.env:ACR_S3_BUCKET}
  # Applied per AgentLoopWorker process; account for worker count when tuning.
  tps_limit: 8
  # Per model call; cumulative context is configured in the training script.
  max_tokens_per_turn: 8192
  max_rollout_time: 1800

  history_mode: linear
  linear_on_nonlinear: reset
  fork_threshold_tokens: 0

  reward_thresholds:
    task_success: 1.0
    build_success: 0.5
