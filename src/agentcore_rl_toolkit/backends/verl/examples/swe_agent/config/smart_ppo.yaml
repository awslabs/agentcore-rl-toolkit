actor_rollout_ref:
  actor:
    # no bonus for high entropy
    entropy_coeff: 0
    # report entropy for stability monitoring
    calculate_entropy: true

    # no KL loss per verl's grpo.md
    use_kl_loss: false

    # per Dr. GRPO
    # loss_agg_mode: seq-mean-token-sum-norm

    # length-aggregated across sequence
    loss_agg_mode: seq-mean-token-sum
  model:
    use_remove_padding: true
  rollout:
    multi_turn:
      enable: true
    calculate_log_probs: true
    mode: async
    name: vllm
    engine_kwargs:
      vllm:
        enable_auto_tool_choice: true
        logprobs_mode: processed_logprobs

algorithm:
  adv_estimator: grpo
  # no normalization per Dr. GRPO, also in grpo.md
  # norm_adv_by_std_in_grpo: false

  # default in GRPO
  norm_adv_by_std_in_grpo: true

  use_kl_in_reward: false

  # these are ignored with bypass
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2
    rollout_rs: null

data:
  return_raw_chat: true

critic:
  enable: false

reward_model:
  use_reward_loop: false

trainer:
  default_local_dir: ${oc.env:checkpoint_path_prefix}/${trainer.project_name}/${trainer.experiment_name}
  logger:
    - console
    - mlflow
