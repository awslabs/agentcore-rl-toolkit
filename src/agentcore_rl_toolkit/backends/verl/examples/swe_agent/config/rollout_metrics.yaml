# Prometheus-based rollout observability: one top-level key per trainer mixin
# (amzn_aws_agentic_ai_recipe_rl/verl_extensions/trainer_mixins/), plus the
# server-side endpoints they depend on.
#
# `rollout_metrics` owns the trainer-side scrape/derive that used to be gated by
# verl's `actor_rollout_ref.rollout.prometheus.{collect_step_metrics,collection_timeout}`.
# The server-side prometheus endpoints are still configured under
# `actor_rollout_ref.rollout.prometheus` (verl launches vLLM and must have
# `prometheus.enable: true` for these endpoints to exist).

# RolloutMetricsMixin: scrape the vLLM endpoints from the trainer and log the
# per-step deltas as rollout/* to the tracker.
rollout_metrics:
  # Master switch for scraping + deriving rollout/* metrics each logged step.
  enable: true
  # Per-instance scrape timeout, in seconds.
  collection_timeout: 10.0

# PrometheusRunTargetsMixin: publish this run's vLLM endpoints to a Prometheus
# server as a file-service-discovery entry, tagged with the experiment name.
# Independent of the scrape above; unset `path` to write nothing.
prometheus_targets:
  path: /fsx/ubuntu/users/vdanylo/verl/prometheus/runs/${trainer.experiment_name}.json


actor_rollout_ref:
  rollout:
    disable_log_stats: false
    prometheus:
      enable: true
