name: Tinker API Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "src/agentcore_rl_toolkit/backends/tinker_api/**"
      - "src/agentcore_rl_toolkit/rollout_gateway/**"
      - "src/agentcore_rl_toolkit/client.py"
      - "tests/backends/tinker_api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tinker-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/agentcore_rl_toolkit/backends/tinker_api/**"
      - "src/agentcore_rl_toolkit/rollout_gateway/**"
      - "src/agentcore_rl_toolkit/client.py"
      - "tests/backends/tinker_api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tinker-api.yml"
  workflow_dispatch:

jobs:
  test:
    name: Tinker API (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extra: [tinker_api, tinker_skyrl]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .github/workflows/tinker-api.yml

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --python 3.12 --extra dev --extra gateway --extra ${{ matrix.extra }}

      - name: Run Tinker backend tests
        run: uv run --no-sync pytest tests/backends/tinker_api/ -v
        env:
          AWS_DEFAULT_REGION: us-west-2
          HF_HUB_DISABLE_TELEMETRY: "1"
