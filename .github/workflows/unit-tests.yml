name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Go for Sandbox SDK contract tests
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          AWS_DEFAULT_REGION: us-west-2

  sagemaker-rft:
    name: SageMaker RFT SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group sagemaker-integration

      - name: Run SageMaker RFT tests
        run: uv run --no-sync pytest tests/runtime/test_sagemaker_rft.py -v
        env:
          AWS_DEFAULT_REGION: us-west-2
