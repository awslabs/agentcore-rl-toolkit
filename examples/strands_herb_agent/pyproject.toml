[project]
name = "strands-herb-agent-example"
version = "0.1.0"
description = "Example: Strands HERB enterprise deep-search agent (evaluation) using Bedrock AgentCore RL Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcore-rl-toolkit[core]==0.2.0",
    "bedrock-agentcore>=1.0.3",
    "boto3>=1.40.55",
    "strands-agents[openai]>=1.63.0",
    "httpx",
    "numpy",
    "llama-index-core==0.14.25",
    "llama-index-retrievers-bm25==0.8.0",
]

[tool.setuptools]
py-modules = ["rl_app", "reward", "models", "tools", "retrieval", "upstream", "helper_llm"]
