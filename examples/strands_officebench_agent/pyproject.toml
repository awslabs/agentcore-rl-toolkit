[project]
name = "strands-officebench-agent-example"
version = "0.1.0"
description = "Example: Strands OfficeBench Agent using Bedrock AgentCore RL Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcore-rl-toolkit[core]==0.2.0",
    "bedrock-agentcore>=1.0.3",
    "boto3>=1.40.55",
    "python-dotenv>=1.0.0",
    "strands-agents[openai]>=1.18.0",
    # 0.9.0 removed strands_tools.shell, which this agent uses; moving to strands.vended_tools.shell
    # changes the tool's security boundary and is a separate change.
    "strands-agents-tools>=0.2.16,<0.9.0",
    # OfficeBench evaluation deps
    "openpyxl",
    "python-docx",
    "PyMuPDF",
    # Imported by OfficeBench's pdf_read_file script; without it the agent's pdf_read_file tool fails.
    "PyPDF2",
    "pdf2docx",
    "pytesseract",
    "icalendar",
    "Pillow",
    "pytz",
    "fire",
    # Imported by OfficeBench's word_app scripts (word_create_new_file, word_write_to_file).
    "pandas",
]

[tool.setuptools]
py-modules = ["rl_app", "reward", "models", "utils", "tools"]
