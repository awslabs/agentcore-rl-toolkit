[project]
name = "strands-math-agent-example"
version = "0.1.0"
description = "Example: Strands Math Agent using Bedrock AgentCore RL Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcore-rl-toolkit[core]==0.2.0",
    "python-dotenv>=1.0.0",
    "strands-agents[openai]>=1.18.0",
    "strands-agents-tools>=0.2.16",
]

[tool.setuptools]
py-modules = ["basic_app", "rl_app", "runtime_app", "models", "reward"]
