[project]
name = "strands-excytin-agent-example"
version = "0.1.0"
description = "Example: Strands ExCyTIn security investigation agent using Bedrock AgentCore RL Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcore-rl-toolkit[core]==0.2.0",
    "bedrock-agentcore>=1.0.3",
    "boto3>=1.40.55",
    "strands-agents[openai]>=1.63.0",
]

[project.optional-dependencies]
# env/: the environment service and its databases
env = ["pymysql==2.2.8", "huggingface_hub"]

[tool.setuptools]
py-modules = ["rl_app", "reward", "models", "tools"]
