[project]
name = "biomni-research-agent-example"
version = "0.1.0"
description = "Example: Biomni research agent using Bedrock AgentCore RL Toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentcore-rl-toolkit[core]==0.2.0",
    "bedrock-agentcore>=1.0.3",
    "beautifulsoup4==4.15.0",
    "biopython==1.88",
    "duckdb==1.5.5",
    "graphql-core==3.2.12",
    "jsonschema==4.25.1",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    "requests==2.32.5",
]

[tool.setuptools]
py-modules = ["rl_app", "tool_service", "prepare_data"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["gwas/prompts/*.txt", "gwas/clients/gwas_catalog_sql/resources/*"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Upstream tool docstrings and messages, kept verbatim.
"harness/seqqa/{official,db_subset}.py" = ["E501"]
