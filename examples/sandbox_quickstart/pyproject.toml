[project]
name = "sandbox-quickstart-example"
version = "0.1.0"
description = "Run shell commands in an arbitrary Docker image on AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    "agentcore-rl-toolkit[rollout]==0.2.0",
    "boto3>=1.40.55",
]

[tool.setuptools]
py-modules = ["run_sandbox", "deploy"]
